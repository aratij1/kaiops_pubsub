global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/telemetry-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - host.docker.internal:9093

otlp:
  keep_identifying_resource_attributes: true
  # Synced against upstream src/prometheus/prometheus-config.yaml (demo 3.0.0)
  # — this file fully replaces the upstream config (compose.kaiops.yaml mounts
  # it in place of the base one), so attributes upstream added since this
  # override was written need to be carried forward manually or metrics lose
  # those labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - service.criticality
    - cloud.availability_zone
    - cloud.region
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - container.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - kafka.cluster.alias
    - collector.instance.id

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: telemetry-prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          project: telemetry
          application: Telemetry
          environment: prod
