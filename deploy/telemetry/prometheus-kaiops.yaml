global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/telemetry-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - host.docker.internal:9093

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - deployment.environment.name
    - container.name

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: telemetry-prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          project: telemetry
          application: Telemetry
          environment: prod
