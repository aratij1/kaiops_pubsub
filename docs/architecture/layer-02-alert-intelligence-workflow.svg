<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.bg{fill:#fff}.lane{fill:#f8fafc;stroke:#64748b;stroke-width:1.4;rx:18}.box{fill:#fff;stroke:#475569;stroke-width:1.2;rx:8}.bus{fill:#eef2ff;stroke:#4338ca;stroke-width:1.5;rx:10}.orange{fill:#fff7ed;stroke:#ea580c}.blue{fill:#eff6ff;stroke:#2563eb}.red{fill:#fff1f2;stroke:#e11d48}.title{font:700 24px Arial;fill:#111827}.h{font:700 15px Arial;fill:#111827}.t{font:13px Arial;fill:#111827}.s{font:11px Arial;fill:#475569}.a{stroke:#334155;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.soft{stroke:#64748b;stroke-width:1.3;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1180" height="560"/><text class="title" x="34" y="42">Layer 02 - Alert Intelligence And Workflow</text><text class="s" x="34" y="64">Routing, load management, policy decisions, and worker orchestration.</text>
  <rect class="bus" x="40" y="120" width="190" height="300"/><text class="h" x="78" y="152">Message Topics</text><rect class="box" x="65" y="180" width="140" height="35"/><text class="s" x="96" y="202">raw-alerts</text><rect class="box" x="65" y="230" width="140" height="35"/><text class="s" x="87" y="252">enriched-alerts</text><rect class="box" x="65" y="280" width="140" height="35"/><text class="s" x="82" y="302">orchestration</text><rect class="box" x="65" y="330" width="140" height="35"/><text class="s" x="96" y="352">dead-letter</text>
