  </defs>

  <rect class="bg" x="0" y="0" width="1420" height="760"/>
  <text class="title" x="36" y="44">KaiOps Corrected Enterprise Architecture</text>
  <text class="small" x="36" y="66">Alert intake, event orchestration, AI intelligence, approval, remediation, and notification flow</text>

  <!-- Alert Sources -->
  <rect class="lane" x="30" y="100" width="165" height="470"/>
  <text class="lane-title" x="54" y="130">Alert Sources</text>
  <rect class="box" x="55" y="154" width="115" height="42"/>
  <text class="text" x="76" y="180">Prometheus</text>
  <rect class="box" x="55" y="212" width="115" height="42"/>
  <text class="text" x="74" y="238">Alertmanager</text>
  <rect class="box" x="55" y="270" width="115" height="42"/>
  <text class="text" x="80" y="296">File Watcher</text>
  <rect class="box" x="55" y="328" width="115" height="42"/>
  <text class="text" x="83" y="354">Cloud APIs</text>
  <rect class="box" x="55" y="386" width="115" height="42"/>
  <text class="text" x="74" y="412">External Apps</text>
  <rect class="box" x="55" y="444" width="115" height="42"/>
  <text class="text" x="80" y="470">Manual Test</text>
  <rect class="box" x="55" y="502" width="115" height="42"/>
  <text class="text" x="77" y="528">ETL Jobs</text>

