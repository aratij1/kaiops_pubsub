  <path class="arrow" d="M 195 335 L 245 310"/>
  <path class="arrow" d="M 395 310 L 480 290"/>
  <path class="arrow" d="M 595 291 L 675 291"/>
  <path class="arrow" d="M 845 291 L 875 291"/>
  <path class="arrow" d="M 942 332 L 942 370"/>
  <path class="arrow" d="M 875 411 L 645 411"/>
  <path class="arrow" d="M 760 332 L 760 370"/>
  <path class="arrow" d="M 1010 411 L 1320 335"/>

  <path class="arrow-soft" d="M 760 332 C 830 590 890 650 748 650"/>
  <path class="arrow-soft" d="M 565 332 C 565 600 600 650 650 650"/>
  <path class="arrow-soft" d="M 940 332 C 940 596 900 650 840 650"/>
  <path class="arrow-soft" d="M 1120 530 C 1120 650 1030 686 1040 686"/>
  <path class="arrow-soft" d="M 1040 686 C 1100 686 1118 530 1180 530"/>

  <path class="arrow" d="M 845 292 C 925 210 1015 190 1105 210"/>
  <path class="arrow" d="M 1265 282 C 1300 290 1310 310 1320 335"/>
  <path class="arrow" d="M 1265 488 L 1320 488"/>

  <!-- Governance rail -->
  <rect class="box-orange" x="455" y="34" width="835" height="38"/>
  <text class="text" x="478" y="58">Cross-cutting governance: Auth/RBAC, tenant/env config, secrets, policy checks, audit trail, trace IDs, cost/quality guardrails</text>
</svg>
