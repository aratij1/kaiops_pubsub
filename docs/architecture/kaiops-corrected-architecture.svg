  <text class="small" x="266" y="316">validate</text>
  <text class="small" x="266" y="334">normalize</text>
  <text class="small" x="266" y="352">dedupe + persist</text>

  <!-- Application layer -->
  <rect class="lane-app" x="455" y="96" width="585" height="525"/>
  <text class="lane-title" x="480" y="126">Application / Workflow Layer</text>

  <rect class="box-blue" x="480" y="154" width="115" height="58"/>
  <text class="text" x="501" y="178">API Gateway</text>
  <text class="tiny" x="501" y="196">single entry</text>

  <rect class="box" x="620" y="154" width="105" height="58"/>
  <text class="text" x="644" y="178">Config</text>
  <text class="tiny" x="640" y="196">cloud/profile</text>

  <rect class="box" x="750" y="154" width="105" height="58"/>
  <text class="text" x="776" y="178">RBAC</text>
  <text class="tiny" x="766" y="196">users/roles</text>

  <rect class="box" x="880" y="154" width="130" height="58"/>
  <text class="text" x="904" y="178">Onboarding</text>
  <text class="tiny" x="900" y="196">apps/docs/rules</text>

  <rect class="box-green" x="480" y="250" width="165" height="82"/>
  <text class="text" x="505" y="278">Monitoring Adapter</text>
  <text class="tiny" x="506" y="298">alert intake API</text>
  <text class="tiny" x="506" y="316">rules + targets</text>

  <rect class="box-orange" x="675" y="250" width="170" height="82"/>
  <text class="text" x="696" y="278">Workflow Orchestrator</text>
  <text class="tiny" x="707" y="298">route + assign</text>
  <text class="tiny" x="707" y="316">policy + retries</text>

  <rect class="box-red" x="875" y="250" width="135" height="82"/>
  <text class="text" x="898" y="278">Approval Service</text>
  <text class="tiny" x="910" y="298">human gate</text>
  <text class="tiny" x="910" y="316">audit decision</text>

  <rect class="box-red" x="480" y="370" width="165" height="82"/>
  <text class="text" x="505" y="398">Remediation Engine</text>
  <text class="tiny" x="512" y="418">dry-run / execute</text>
  <text class="tiny" x="512" y="436">connector-gated</text>

  <rect class="box" x="675" y="370" width="170" height="82"/>
  <text class="text" x="714" y="398">Operational DB</text>
  <text class="tiny" x="704" y="418">alerts/incidents</text>
  <text class="tiny" x="704" y="436">approvals/audit</text>

  <rect class="box" x="875" y="370" width="135" height="82"/>
  <text class="text" x="910" y="398">Cockpit UI</text>
  <text class="tiny" x="900" y="418">dashboards</text>
  <text class="tiny" x="900" y="436">timeline/docs</text>

  <rect class="box" x="480" y="492" width="165" height="70"/>
  <text class="text" x="514" y="520">Audit Timeline</text>
  <text class="tiny" x="514" y="540">trace + events</text>

  <rect class="box" x="675" y="492" width="170" height="70"/>
  <text class="text" x="703" y="520">Policy / Governance</text>
  <text class="tiny" x="708" y="540">risk + approval rules</text>

  <rect class="box" x="875" y="492" width="135" height="70"/>
  <text class="text" x="900" y="520">Reports</text>
  <text class="tiny" x="895" y="540">SLA / MTTR / AI</text>

  <!-- Message Bus -->
  <rect class="bus" x="455" y="650" width="585" height="72"/>
  <text class="lane-title" x="480" y="678">Message Bus Backbone</text>
  <text class="small" x="480" y="700">raw-alerts | enriched-alerts | orchestration-events | context-events | resolution-events | approval-events | remediation-events | notification-events</text>

  <!-- AI Layer -->
  <rect class="lane-ai" x="1080" y="130" width="210" height="400"/>
  <text class="lane-title" x="1104" y="160">AI Intelligence Layer</text>
  <rect class="box-purple" x="1105" y="186" width="160" height="54"/>
  <text class="text" x="1146" y="210">Context Agent</text>
  <text class="tiny" x="1132" y="228">evidence pack</text>
  <rect class="box-purple" x="1105" y="256" width="160" height="54"/>
  <text class="text" x="1142" y="280">Resolution Agent</text>
  <text class="tiny" x="1132" y="298">RCA + fix plan</text>
  <rect class="box-purple" x="1105" y="326" width="160" height="54"/>
  <text class="text" x="1144" y="350">Model Router</text>
  <text class="tiny" x="1128" y="368">OpenAI/Gemini/Groq</text>
  <rect class="box-purple" x="1105" y="396" width="160" height="54"/>
  <text class="text" x="1140" y="420">Knowledge Router</text>
  <text class="tiny" x="1132" y="438">RAG retrieval</text>
  <rect class="box-purple" x="1105" y="466" width="160" height="44"/>
  <text class="text" x="1120" y="492">Vector DB / RAG Index</text>

