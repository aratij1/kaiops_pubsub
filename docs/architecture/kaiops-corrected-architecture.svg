  <rect class="box" x="1330" y="158" width="50" height="44"/>
  <text class="small" x="1338" y="184">Email</text>
  <rect class="box" x="1330" y="220" width="50" height="44"/>
  <text class="small" x="1338" y="246">Teams</text>
  <rect class="box" x="1330" y="282" width="50" height="44"/>
  <text class="small" x="1340" y="308">ITSM</text>
  <rect class="box" x="1330" y="344" width="50" height="44"/>
  <text class="small" x="1337" y="370">Slack</text>
  <rect class="box" x="1330" y="406" width="50" height="44"/>
  <text class="small" x="1335" y="432">Hooks</text>
  <rect class="box" x="1330" y="468" width="50" height="44"/>
  <text class="small" x="1335" y="494">Close</text>

