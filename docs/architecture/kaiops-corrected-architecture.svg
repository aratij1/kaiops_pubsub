<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="760" viewBox="0 0 1420 760">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38465a"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .lane { fill: #f8fafc; stroke: #6b7280; stroke-width: 1.4; rx: 18; }
      .lane-app { fill: #f5faff; stroke: #64748b; stroke-width: 1.4; rx: 18; }
      .lane-ai { fill: #fbf7ff; stroke: #7c3aed; stroke-width: 1.4; rx: 18; }
      .lane-out { fill: #fffaf2; stroke: #9a6700; stroke-width: 1.4; rx: 18; }
      .box { fill: #ffffff; stroke: #475569; stroke-width: 1.2; rx: 8; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.2; rx: 8; }
      .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.2; rx: 8; }
      .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.2; rx: 8; }
      .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.2; rx: 8; }
      .box-red { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.2; rx: 8; }
      .bus { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.6; rx: 12; }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .lane-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #111827; }
      .text { font-family: Arial, sans-serif; font-size: 13px; fill: #111827; }
      .small { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
      .tiny { font-family: Arial, sans-serif; font-size: 10px; fill: #64748b; }
      .arrow { stroke: #38465a; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1; }
