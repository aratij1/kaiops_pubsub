<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2100" viewBox="0 0 1400 2100">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .svc{fill:#efd400;stroke:#8f8200;stroke-width:1.5}
      .bus{fill:#d9ecff;stroke:#2f6fa8;stroke-width:1.5}
      .cfg{fill:#102033;stroke:#31475f;stroke-width:1.5}
      .store{fill:#f4f7fb;stroke:#8aa2bb;stroke-width:1.5}
      .out{fill:#eaf7ef;stroke:#4b9460;stroke-width:1.5}
      .txt{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#111827}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#334155}
      .cfgtext{font-family:Consolas,monospace;font-size:14px;fill:#eef6ff}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#111827}
      .lane{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#475569}
      .arrow{stroke:#4b5563;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="2100"/>
  <text class="title" x="365" y="52">KaiOps Corrected Incident Processing Flow</text>

  <text class="lane" x="55" y="110">Intake</text>
  <text class="lane" x="55" y="520">Alert Intelligence</text>
  <text class="lane" x="55" y="835">Orchestration + Config</text>
  <text class="lane" x="55" y="1175">AI Context + Resolution</text>
  <text class="lane" x="55" y="1565">Approval + Remediation</text>
  <text class="lane" x="55" y="1915">Closure + Outputs</text>

  <g filter="url(#shadow)">
    <rect class="svc" x="530" y="90" rx="12" ry="12" width="270" height="70"/>
    <text class="txt" x="575" y="120">Third-party alerts</text>
    <text class="small" x="590" y="145">Prometheus, Grafana, tools</text>

    <rect class="svc" x="530" y="205" rx="12" ry="12" width="270" height="78"/>
    <text class="txt" x="565" y="235">Landing Pad</text>
    <text class="small" x="570" y="260">/input or webhook endpoint</text>

    <rect class="svc" x="530" y="325" rx="12" ry="12" width="270" height="78"/>
    <text class="txt" x="565" y="355">Monitoring Adapter</text>
    <text class="small" x="570" y="380">canonical alert normalization</text>

    <rect class="bus" x="530" y="445" rx="12" ry="12" width="270" height="64"/>
    <text class="txt" x="590" y="475">Bus: raw-alerts</text>
    <text class="small" x="575" y="498">canonical alert envelope</text>

    <rect class="svc" x="530" y="555" rx="12" ry="12" width="270" height="78"/>
    <text class="txt" x="565" y="585">Alert Intelligence</text>
    <text class="small" x="562" y="610">severity, dedupe, correlate</text>

    <rect class="svc" x="180" y="690" rx="12" ry="12" width="250" height="70"/>
    <text class="txt" x="225" y="720">Severity classification</text>
    <text class="small" x="242" y="745">policy + labels</text>

    <rect class="svc" x="540" y="690" rx="12" ry="12" width="250" height="70"/>
    <text class="txt" x="605" y="720">Deduplication</text>
    <text class="small" x="592" y="745">fingerprint + incident</text>

    <rect class="svc" x="900" y="690" rx="12" ry="12" width="250" height="70"/>
    <text class="txt" x="950" y="720">Incident correlation</text>
    <text class="small" x="955" y="745">service + environment</text>

    <rect class="bus" x="530" y="805" rx="12" ry="12" width="270" height="64"/>
    <text class="txt" x="570" y="835">Bus: enriched-alerts</text>
    <text class="small" x="565" y="858">incident-aware alert signal</text>

    <rect class="svc" x="530" y="905" rx="12" ry="12" width="270" height="78"/>
    <text class="txt" x="592" y="935">Orchestrator</text>
    <text class="small" x="558" y="960">workflow + worker routing</text>

    <rect class="cfg" x="875" y="895" rx="12" ry="12" width="390" height="108"/>
    <text class="cfgtext" x="895" y="925">Reads routing/config inputs:</text>
    <text class="cfgtext" x="895" y="950">kaiops-connections.json</text>
    <text class="cfgtext" x="895" y="972">playbooks.json, action_catalog.json</text>
    <text class="cfgtext" x="895" y="994">risk tier, execution mode, bus provider</text>

    <rect class="svc" x="530" y="1030" rx="12" ry="12" width="270" height="86"/>
    <text class="txt" x="570" y="1060">Config + Connector</text>
    <text class="small" x="558" y="1085">monitoring, RAG, executor</text>
    <text class="small" x="575" y="1105">tenant/env/service profile</text>

    <rect class="bus" x="530" y="1145" rx="12" ry="12" width="270" height="64"/>
    <text class="txt" x="550" y="1175">Bus: orchestration-events</text>
    <text class="small" x="560" y="1198">runnable work item</text>

    <rect class="svc" x="140" y="1260" rx="12" ry="12" width="250" height="74"/>
    <text class="txt" x="190" y="1290">Context Agent</text>
    <text class="small" x="170" y="1315">collects evidence</text>

    <rect class="store" x="80" y="1390" rx="12" ry="12" width="250" height="74"/>
    <text class="txt" x="120" y="1420">Index + documents</text>
    <text class="small" x="110" y="1445">embedding + metadata filters</text>

    <rect class="store" x="80" y="1495" rx="12" ry="12" width="250" height="74"/>
    <text class="txt" x="127" y="1525">Semantic search</text>
    <text class="small" x="118" y="1550">ranked RAG matches</text>

    <rect class="svc" x="430" y="1390" rx="12" ry="12" width="250" height="74"/>
    <text class="txt" x="475" y="1420">Context merge</text>
    <text class="small" x="456" y="1445">docs + connectors + deps</text>

    <rect class="bus" x="430" y="1495" rx="12" ry="12" width="250" height="64"/>
    <text class="txt" x="472" y="1525">Bus: context-events</text>

    <rect class="svc" x="790" y="1260" rx="12" ry="12" width="250" height="74"/>
    <text class="txt" x="835" y="1290">Resolution Agent</text>
    <text class="small" x="830" y="1315">RCA, impact, action</text>

    <rect class="svc" x="790" y="1390" rx="12" ry="12" width="250" height="74"/>
    <text class="txt" x="835" y="1420">Evaluation scores</text>
    <text class="small" x="820" y="1445">confidence, grounding, risk</text>

    <rect class="bus" x="790" y="1495" rx="12" ry="12" width="250" height="64"/>
    <text class="txt" x="823" y="1525">Bus: resolution-events</text>

    <rect class="svc" x="790" y="1620" rx="12" ry="12" width="250" height="80"/>
    <text class="txt" x="838" y="1650">Approval Service</text>
    <text class="small" x="815" y="1675">editable script/query/plan</text>

    <rect class="bus" x="790" y="1740" rx="12" ry="12" width="250" height="64"/>
    <text class="txt" x="830" y="1770">Bus: approval-events</text>

    <rect class="svc" x="430" y="1620" rx="12" ry="12" width="250" height="80"/>
    <text class="txt" x="468" y="1650">Remediation Engine</text>
    <text class="small" x="454" y="1675">policy, dry-run, executor</text>

    <rect class="cfg" x="80" y="1620" rx="12" ry="12" width="285" height="108"/>
    <text class="cfgtext" x="100" y="1650">Execution gates:</text>
    <text class="cfgtext" x="100" y="1675">connector executor + secret_ref</text>
    <text class="cfgtext" x="100" y="1697">blast radius + rollback plan</text>
    <text class="cfgtext" x="100" y="1719">human approval if required</text>

    <rect class="bus" x="430" y="1740" rx="12" ry="12" width="250" height="64"/>
    <text class="txt" x="463" y="1770">Bus: remediation-events</text>

    <rect class="svc" x="430" y="1855" rx="12" ry="12" width="250" height="78"/>
    <text class="txt" x="472" y="1885">Closure Service</text>
    <text class="small" x="455" y="1910">post-checks + incident update</text>

    <rect class="bus" x="430" y="1970" rx="12" ry="12" width="250" height="64"/>
    <text class="txt" x="478" y="2000">Bus: closure-events</text>

    <rect class="out" x="790" y="1900" rx="12" ry="12" width="250" height="80"/>
    <text class="txt" x="835" y="1930">Outputs</text>
    <text class="small" x="820" y="1955">Dashboard, Email, Teams</text>
  </g>

  <path class="arrow" d="M665 160 L665 205"/>
  <path class="arrow" d="M665 283 L665 325"/>
  <path class="arrow" d="M665 403 L665 445"/>
  <path class="arrow" d="M665 509 L665 555"/>
  <path class="arrow" d="M665 633 L305 690"/>
  <path class="arrow" d="M665 633 L665 690"/>
  <path class="arrow" d="M665 633 L1025 690"/>
  <path class="arrow" d="M305 760 L665 805"/>
  <path class="arrow" d="M665 760 L665 805"/>
  <path class="arrow" d="M1025 760 L665 805"/>
  <path class="arrow" d="M665 869 L665 905"/>
  <path class="dash" d="M800 944 L875 944"/>
  <path class="arrow" d="M665 983 L665 1030"/>
  <path class="arrow" d="M665 1116 L665 1145"/>
  <path class="arrow" d="M665 1209 L265 1260"/>
  <path class="arrow" d="M265 1334 L205 1390"/>
  <path class="arrow" d="M205 1464 L205 1495"/>
  <path class="arrow" d="M330 1530 L430 1430"/>
  <path class="arrow" d="M555 1464 L555 1495"/>
  <path class="arrow" d="M680 1528 L790 1295"/>
  <path class="arrow" d="M915 1334 L915 1390"/>
  <path class="arrow" d="M915 1464 L915 1495"/>
  <path class="arrow" d="M915 1559 L915 1620"/>
  <path class="arrow" d="M915 1700 L915 1740"/>
  <path class="arrow" d="M790 1772 L680 1660"/>
  <path class="dash" d="M365 1670 L430 1670"/>
  <path class="arrow" d="M555 1700 L555 1740"/>
  <path class="arrow" d="M555 1804 L555 1855"/>
  <path class="arrow" d="M555 1933 L555 1970"/>
  <path class="arrow" d="M680 2000 L790 1940"/>

  <text class="small" x="925" y="1048">Key correction:</text>
  <text class="small" x="925" y="1074">Context, Resolution, Approval, Remediation, and Closure do not all start together.</text>
  <text class="small" x="925" y="1098">They are chained by bus topics and each consumes the previous stage's event.</text>
</svg>

