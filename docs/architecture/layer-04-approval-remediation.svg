<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.bg{fill:#fff}.box{fill:#fff;stroke:#475569;stroke-width:1.2;rx:8}.red{fill:#fff1f2;stroke:#e11d48}.orange{fill:#fff7ed;stroke:#ea580c}.green{fill:#ecfdf5;stroke:#059669}.blue{fill:#eff6ff;stroke:#2563eb}.title{font:700 24px Arial;fill:#111827}.h{font:700 15px Arial;fill:#111827}.s{font:11px Arial;fill:#475569}.a{stroke:#334155;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.soft{stroke:#64748b;stroke-width:1.3;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1180" height="560"/><text class="title" x="34" y="42">Layer 04 - Approval And Remediation</text><text class="s" x="34" y="64">Human gate, editable remediation script, connector execution, post-checks, and closure.</text>
  <rect class="blue box" x="45" y="210" width="155" height="95"/><text class="h" x="78" y="242">Resolution</text><text class="s" x="75" y="266">recommendation</text><text class="s" x="75" y="284">risk + evidence</text>
