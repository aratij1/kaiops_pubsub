  <rect class="purple box" x="780" y="260" width="175" height="85"/><text class="h" x="819" y="292">Resolution Agent</text><text class="s" x="812" y="316">RCA + impact</text><text class="s" x="812" y="334">fix plan</text>
  <rect class="blue box" x="1015" y="220" width="145" height="90"/><text class="h" x="1042" y="252">AI Output</text><text class="s" x="1038" y="276">confidence</text><text class="s" x="1038" y="294">grounding + risk</text>
