<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.bg{fill:#fff}.box{fill:#fff;stroke:#475569;stroke-width:1.2;rx:8}.purple{fill:#f5f3ff;stroke:#7c3aed}.green{fill:#ecfdf5;stroke:#059669}.blue{fill:#eff6ff;stroke:#2563eb}.title{font:700 24px Arial;fill:#111827}.h{font:700 15px Arial;fill:#111827}.s{font:11px Arial;fill:#475569}.a{stroke:#334155;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.soft{stroke:#64748b;stroke-width:1.3;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1180" height="560"/><text class="title" x="34" y="42">Layer 03 - AI Intelligence</text><text class="s" x="34" y="64">Context retrieval, RAG, LLM routing, RCA generation, and quality scoring.</text>
  <rect class="blue box" x="40" y="220" width="160" height="90"/><text class="h" x="73" y="252">Context Event</text><text class="s" x="66" y="276">alert + service</text><text class="s" x="66" y="294">trace + labels</text>
  <rect class="purple box" x="275" y="125" width="175" height="85"/><text class="h" x="319" y="157">Context Agent</text><text class="s" x="304" y="181">validate signal</text><text class="s" x="304" y="199">assemble evidence</text>
  <rect class="purple box" x="275" y="260" width="175" height="85"/><text class="h" x="311" y="292">Knowledge Router</text><text class="s" x="304" y="316">service scoped search</text><text class="s" x="304" y="334">metadata prefilter</text>
  <rect class="green box" x="525" y="125" width="180" height="85"/><text class="h" x="563" y="157">Embedding Service</text><text class="s" x="552" y="181">text-embedding-3-large</text><text class="s" x="552" y="199">fallback hash model</text>
  <rect class="green box" x="525" y="260" width="180" height="85"/><text class="h" x="559" y="292">Vector / RAG Index</text><text class="s" x="552" y="316">hybrid search</text><text class="s" x="552" y="334">rerank + citations</text>
