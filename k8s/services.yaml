apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: kaiops
spec:
  replicas: 1
  selector: { matchLabels: { app: ui } }
  template:
    metadata: { labels: { app: ui } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ui
          image: ghcr.io/example/kaiops/ui:latest
          envFrom: [{ configMapRef: { name: kaiops-config } }]
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: kaiops
spec:
  selector: { app: ui }
  ports: [{ port: 8501, targetPort: 80 }]
