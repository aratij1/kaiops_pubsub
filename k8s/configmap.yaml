apiVersion: v1
kind: ConfigMap
metadata:
  name: kaiops-config
  namespace: kaiops
data:
  ENVIRONMENT: prod
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_URL: redis://redis:6379/0
  CONTEXT_AGENT_URL: http://context-agent:8000
  APPROVAL_SERVICE_URL: http://approval-service:8000
  MONITORING_ADAPTER_URL: http://monitoring-adapter:8000
  MODEL_ROUTER_URL: http://model-router:8000
  API_GATEWAY_URL: http://api-gateway:8000
  OPENAI_GPT5_MODEL: gpt-5
  OPENAI_GPT4O_MODEL: gpt-4o
  GEMINI_MODEL: gemini-2.5-flash
  GROQ_MODEL: llama-3.3-70b-versatile
  LOCAL_LLM_ENABLED: "false"
  LLM_REQUEST_TIMEOUT_SECONDS: "120"
  GATEWAY_REQUEST_TIMEOUT_SECONDS: "180"
  KAFKA_ENABLED: "true"
  KAFKA_CONSUMER_MAX_RETRIES: "3"
  KAFKA_DLQ_SUFFIX: .dlq
  RABBITMQ_CONSUMER_MAX_RETRIES: "3"
  RABBITMQ_DLQ_SUFFIX: .dlq
  AZURE_SERVICE_BUS_ENABLED: "false"
  AZURE_SERVICE_BUS_TOPIC_PREFIX: kaiops
  AZURE_SERVICE_BUS_SUBSCRIPTION_PREFIX: kaiops
  AZURE_SERVICE_BUS_DLQ_SUFFIX: .dlq
  AZURE_SERVICE_BUS_CONSUMER_MAX_RETRIES: "3"
  AZURE_CONTENT_SAFETY_ENABLED: "false"
  AZURE_CONTENT_SAFETY_API_VERSION: "2024-09-01"
  AZURE_CONTENT_SAFETY_SANITIZE_RESPONSES: "false"
  AZURE_OPENAI_EMBEDDINGS_ENABLED: "false"
  AZURE_OPENAI_API_VERSION: "2024-06-01"
  AZURE_AI_EVALUATION_ENABLED: "false"
  AZURE_AI_EVALUATION_METRIC: coherence
  OBSERVABILITY_AZURE_MONITOR_ENABLED: "false"
  DATABASE_ENABLED: "true"
  TRUST_X_FORWARDED_FOR: "true"
