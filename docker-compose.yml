  resolution-agent:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: resolution-agent }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/ai-workbench/src/resolution-agent
    ports: ["8006:8000"]
    depends_on:
      kafka: { condition: service_healthy }
      mysql: { condition: service_healthy }
      model-router: { condition: service_started }

  approval-service:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: approval-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/approval-service
    ports: ["8007:8000"]
    depends_on:
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  notification-service:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: notification-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/notification-service
    ports: ["8019:8000"]
    depends_on:
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  evaluation-service:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: evaluation-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/ai-workbench/src/evaluation-service
    ports: ["8020:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  remediation-engine:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: remediation-engine }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/remediation-engine
    ports: ["8008:8000"]
    depends_on:
      kafka: { condition: service_healthy }
