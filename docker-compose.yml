    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: model-router }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/ai-workbench/src/model-router
    ports: ["8005:8000"]
    depends_on:
      kafka: { condition: service_healthy }
