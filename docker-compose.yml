x-service-env: &service-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  AUTH_MODE: ${AUTH_MODE:-local}
  DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-local}
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: mysql+aiomysql://kaiops:kaiops@mysql:3306/kaiops
  DB: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: kaiops
  DB_PASSWORD: kaiops
  DB_DATABASE: kaiops
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-kaiops-local-demo-secret-key-change-me}
  ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-Admin@123456}
  EXECUTIVE_USER_PASSWORD: ${EXECUTIVE_USER_PASSWORD:-Executive@123456}
  L3_USER_PASSWORD: ${L3_USER_PASSWORD:-L3Engineer@123456}
  L2_USER_PASSWORD: ${L2_USER_PASSWORD:-L2Engineer@123456}
  L1_USER_PASSWORD: ${L1_USER_PASSWORD:-L1Operator@123456}
  CONTEXT_AGENT_URL: http://context-agent:8000
  APPROVAL_SERVICE_URL: http://approval-service:8000
  MODEL_ROUTER_URL: http://model-router:8000
  MONITORING_ADAPTER_URL: http://monitoring-adapter:8000
  API_GATEWAY_URL: http://api-gateway:8000
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_GPT5_MODEL: ${OPENAI_GPT5_MODEL:-gpt-5}
  OPENAI_GPT4O_MODEL: ${OPENAI_GPT4O_MODEL:-gpt-4o}
  AZURE_OPENAI_ENDPOINT: ${OPENAI_BASE_URL:-}
  AZURE_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AZURE_OPENAI_CHAT_DEPLOYMENT: ${OPENAI_GPT4O_MODEL:-gpt-4o}
  LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-false}
  LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
  GATEWAY_REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-180}
  KAFKA_ENABLED: "false"
  EVENT_BUS_PROVIDER: rabbitmq
  MESSAGE_BUS_DYNAMIC_ROUTING: "false"
  MESSAGE_BUS_STREAM_THRESHOLD: "500"
  MESSAGE_BUS_DEFAULT_PROVIDER: rabbitmq
  MESSAGE_BUS_WORKER_COUNT: "1"
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  RABBITMQ_EXCHANGE: kaiops.events
  RABBITMQ_QUEUE_PREFIX: kaiops
  RABBITMQ_CONSUMER_MAX_RETRIES: "3"
  RABBITMQ_DLQ_SUFFIX: .dlq
  DATABASE_ENABLED: "true"

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile.service

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kaiops
      MYSQL_USER: kaiops
      MYSQL_PASSWORD: kaiops
    ports: ["${MYSQL_HOST_PORT:-3306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -ukaiops -pkaiops"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  mysql-exporter:
    image: prom/mysqld-exporter:v0.16.0
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=kaiops
    environment:
      MYSQLD_EXPORTER_PASSWORD: kaiops
    ports: ["9104:9104"]
    depends_on:
      mysql: { condition: service_healthy }

  node-exporter:
    image: prom/node-exporter:v1.8.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports: ["9100:9100"]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports: ["9115:9115"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports: ["9093:9093"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      monitoring-adapter: { condition: service_started }

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./rag/changes/prometheus_rules:/etc/prometheus/generated-rules:ro
      - prometheus-data:/prometheus
    depends_on:
      api-gateway: { condition: service_healthy }
      monitoring-adapter: { condition: service_started }
      mysql-exporter: { condition: service_started }
      node-exporter: { condition: service_started }
      blackbox-exporter: { condition: service_started }
      alertmanager: { condition: service_started }

  monitoring-adapter:
    build: *service-build
    environment: { <<: *service-env, SERVICE_NAME: monitoring-adapter }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/services/monitoring-adapter
    ports: ["8001:8000"]
    volumes:
      - ./rag:/app/rag
      - ./ingested_alerts:/app/ingested_alerts
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  application-onboarding:
    image: kaiops_pubsub-application-onboarding:latest
    environment: { <<: *service-env, SERVICE_NAME: application-onboarding }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/application-onboarding
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  cloud-operations:
    image: kaiops-consolidated-cloud-operations:latest
    environment:
      <<: *service-env
      SERVICE_NAME: cloud-operations
      CLOUD_OPERATIONS_ENABLED: "true"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/cloud-operations
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  api-gateway:
    build: *service-build
    image: kaiops-consolidated-api-gateway:latest
    environment: { <<: *service-env, SERVICE_NAME: api-gateway }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/services/api-gateway
    ports: ["8010:8000"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      application-onboarding: { condition: service_started }
      cloud-operations: { condition: service_started }
      monitoring-adapter: { condition: service_started }
      approval-service: { condition: service_started }

  alert-intelligence:
    build: *service-build
    environment: { <<: *service-env, SERVICE_NAME: alert-intelligence }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/services/alert-intelligence
    ports: ["8002:8000"]
    depends_on:
      application-onboarding: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  orchestrator:
    build: *service-build
    environment: { <<: *service-env, SERVICE_NAME: orchestrator }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/services/orchestrator
    ports: ["8003:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      context-agent: { condition: service_started }

  context-agent:
    build: *service-build
    environment: { <<: *service-env, SERVICE_NAME: context-agent }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/services/context-agent
    ports: ["8004:8000"]
    volumes:
      - ./rag:/app/rag
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  model-router:
    image: kaiops-consolidated-model-router:latest
    environment: { <<: *service-env, SERVICE_NAME: model-router }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/ai-workbench/src/model-router
    ports: ["8005:8000"]
    depends_on:
      mysql: { condition: service_healthy }

  resolution-agent:
    build: *service-build
    environment: { <<: *service-env, SERVICE_NAME: resolution-agent }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/services/resolution-agent
    ports: ["8006:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      model-router: { condition: service_started }

  approval-service:
    build: *service-build
    environment: { <<: *service-env, SERVICE_NAME: approval-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/services/approval-service
    ports: ["8007:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  remediation-engine:
    build: *service-build
    environment: { <<: *service-env, SERVICE_NAME: remediation-engine }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/services/remediation-engine
    ports: ["8008:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  closure-service:
    build: *service-build
    environment: { <<: *service-env, SERVICE_NAME: closure-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/services/closure-service
    ports: ["8009:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  ui:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.ui
    ports: ["80:80"]
    depends_on:
      api-gateway: { condition: service_healthy }
      approval-service: { condition: service_started }
      monitoring-adapter: { condition: service_started }

volumes:
  mysql-data:
  prometheus-data:
