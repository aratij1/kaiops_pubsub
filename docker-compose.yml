  ui:
    build:
      context: ./frontend/react
      dockerfile: Dockerfile
    ports: ["8501:80"]
    restart: unless-stopped
    depends_on:
      api-gateway: { condition: service_healthy }
      approval-service: { condition: service_started }
      monitoring-adapter: { condition: service_started }

volumes:
  mysql-data:
  prometheus-data:
  redis-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  rabbitmq-data: