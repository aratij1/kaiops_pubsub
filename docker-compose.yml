x-service-build: &service-build
  context: .
  dockerfile: Dockerfile.service

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kaiops}
      MYSQL_USER: ${MYSQL_USER:-kaiops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kaiops}
    ports: ["${MYSQL_HOST_PORT:-3306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-kaiops} -p${MYSQL_PASSWORD:-kaiops}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  mysql-exporter:
    image: prom/mysqld-exporter:v0.16.0
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=${MYSQL_USER:-kaiops}
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_PASSWORD:-kaiops}
    ports: ["9104:9104"]
    depends_on:
      mysql: { condition: service_healthy }

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports: ["9100:9100"]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports: ["9115:9115"]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    restart: unless-stopped
    command:
      - --kafka.server=kafka:9092
    ports: ["9308:9308"]
    depends_on:
      kafka: { condition: service_healthy }

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports: ["9093:9093"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      monitoring-adapter: { condition: service_started }

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./backend/rag/changes/prometheus_rules:/etc/prometheus/generated-rules:ro
      - ./backend/rag/changes/prometheus_targets:/etc/prometheus/generated-targets:ro
      - prometheus-data:/prometheus
    depends_on:
      api-gateway: { condition: service_healthy }
      monitoring-adapter: { condition: service_started }
      mysql-exporter: { condition: service_started }
      node-exporter: { condition: service_started }
      blackbox-exporter: { condition: service_started }
      kafka-exporter: { condition: service_started }
      alertmanager: { condition: service_started }

  monitoring-adapter:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: monitoring-adapter }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/monitoring-adapter
    ports: ["8001:8000"]
    volumes:
      - ./backend/rag:/app/rag
      - ${INGESTED_ALERTS_HOST_PATH:-./backend/ingested_alerts}:/app/ingested_alerts
    depends_on:
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  application-onboarding:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: application-onboarding }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/application-onboarding
    ports: ["8011:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  discovery-service:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: discovery-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/discovery-service
    ports: ["8012:8000"]
    depends_on:
      application-onboarding: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  metrics-validation-agent:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: metrics-validation-agent }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/metrics-validation-agent
    ports: ["8013:8000"]
    depends_on:
      discovery-service: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  rule-generation-agent:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: rule-generation-agent }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/rule-generation-agent
    ports: ["8014:8000"]
    depends_on:
      metrics-validation-agent: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  prometheus-config-service:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: prometheus-config-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/prometheus-config-service
    ports: ["8015:8000"]
    volumes:
      - ./backend/rag:/app/rag
    depends_on:
      rule-generation-agent: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      prometheus: { condition: service_started }

  validation-agent:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: validation-agent }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/validation-agent
    ports: ["8016:8000"]
    depends_on:
      prometheus-config-service: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      prometheus: { condition: service_started }

  dashboard-generator:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: dashboard-generator }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/dashboard-generator
    ports: ["8017:8000"]
    depends_on:
      validation-agent: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  audit-service:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: audit-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/audit-service
    ports: ["8018:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  api-gateway:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: api-gateway }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/api-gateway
    ports: ["8010:8000"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      monitoring-adapter: { condition: service_started }
      application-onboarding: { condition: service_started }
      approval-service: { condition: service_started }
      rabbitmq: { condition: service_healthy }

  alert-intelligence:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: alert-intelligence }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/alert-intelligence
    ports: ["8002:8000"]
    depends_on:
      kafka: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  orchestrator:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: orchestrator }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/orchestrator
    ports: ["8003:8000"]
    depends_on:
