services:
  fault-lab:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./runtime:/app/runtime

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      - fault-lab
