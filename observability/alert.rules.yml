groups:
  - name: kaiops-service-health
    rules:
      - alert: KaiOpsServiceDown
        expr: up{job=~"kaiops-.*"} == 0
        for: 1m
        labels:
          severity: critical
          project_name: KaiOps
          application: KaiOps
        annotations:
          summary: "KaiOps service is down"
          description: "Service {{ $labels.job }} is not reachable by Prometheus for more than 1 minute."

      - alert: KaiOpsHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(kaiops_request_latency_seconds_bucket[5m])) by (le, service, operation)) > 2
        for: 5m
        labels:
          severity: warning
          category: latency
          landing_pad: realtime
          project_name: KaiOps
          application: KaiOps
        annotations:
          summary: "High p95 latency in KaiOps service"
          description: "Service {{ $labels.service }} operation {{ $labels.operation }} p95 latency is above 2s."

      - alert: KaiOpsHighLatencyP99
        expr: histogram_quantile(0.99, sum(rate(kaiops_request_latency_seconds_bucket[5m])) by (le, service, operation)) > 3
        for: 3m
        labels:
          severity: critical
          category: latency
          landing_pad: realtime
          project_name: KaiOps
          application: KaiOps
        annotations:
          summary: "Critical p99 latency in KaiOps service"
          description: "Service {{ $labels.service }} operation {{ $labels.operation }} p99 latency is above 3s."

      - alert: KaiOpsLatencySLIRegression
        expr: |
          (
            sum(rate(kaiops_request_latency_seconds_bucket{le="1"}[10m])) by (service, operation)
            /
            sum(rate(kaiops_request_latency_seconds_count[10m])) by (service, operation)
          ) < 0.95
        for: 10m
        labels:
          severity: warning
          category: latency
          landing_pad: realtime
          project_name: KaiOps
          application: KaiOps
        annotations:
          summary: "Latency SLI regression detected"
          description: "Under 95% of requests are completing within 1 second for {{ $labels.service }} / {{ $labels.operation }} over the last 10 minutes."

  - name: mysql-health
    rules:
      - alert: MySQLExporterDown
        expr: up{job="mysql-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          project_name: KaiOps
          application: KaiOps
        annotations:
          summary: "MySQL exporter is down"
          description: "mysql-exporter is not reachable by Prometheus."

      - alert: MySQLTooManyConnections
        expr: mysql_global_status_threads_connected > 150
        for: 5m
        labels:
          severity: warning
          project_name: KaiOps
          application: KaiOps
        annotations:
          summary: "MySQL connections are high"
          description: "MySQL threads_connected is {{ $value }} which is above threshold 150."

      - alert: KaiOpsMySQLAlertsTableRowsHigh
        expr: kaiops_mysql_alerts_table_rows{database="kaiops", table="alerts"} > 300
        for: 10m
        labels:
          severity: warning
          category: database
          project: kaiops-core
          service: mysql
        annotations:
          summary: "KaiOps alerts table row count is high"
          description: "alerts table has {{ $value }} rows, above threshold 20 for kaiops-core."

  - name: kaiops-enterprise-alerts
    # Local vs k8s rule gating:
    # Kubernetes-only alerts are guarded with:
    #   and on() (count(up{job="kube-state-metrics"}) > 0)
    # This keeps them inactive in local Docker (no kube-state-metrics)
    # and automatically active in Kubernetes environments.
    rules:
      - alert: HighCPUUsage
        expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High CPU usage"
          description: "CPU utilization is above 90% for more than 5 minutes on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100) > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage"
          description: "Memory utilization is above 85% for more than 5 minutes on {{ $labels.instance }}."

      - alert: DiskSpaceLow
        expr: ((1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space low"
          description: "Disk utilization is above 90% on {{ $labels.instance }} mount {{ $labels.mountpoint }}."

      - alert: DiskIOHigh
        expr: sum by (instance) (rate(node_disk_reads_completed_total[5m]) + rate(node_disk_writes_completed_total[5m])) > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk I/O high"
          description: "Disk IOPS exceeded configured threshold on {{ $labels.instance }}."

      - alert: PodRestartingFrequently
        expr: (sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[10m])) > 3) and on() (count(up{job="kube-state-metrics"}) > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod restarting frequently"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 10 minutes."

      - alert: PodCrashLoopBackOff
        expr: (max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) > 0) and on() (count(up{job="kube-state-metrics"}) > 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pod in CrashLoopBackOff"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is in CrashLoopBackOff."

      - alert: ServiceDown
        expr: up{job=~"kaiops-.*"} == 0
        for: 2m
        labels:
          severity: critical
          project_name: KaiOps
          application: KaiOps
        annotations:
          summary: "Service down"
          description: "Endpoint {{ $labels.job }} is unreachable."

      - alert: HighErrorRate
        expr: (sum(rate(kaiops_gateway_requests_total{status!="ok"}[5m])) / clamp_min(sum(rate(kaiops_gateway_requests_total[5m])), 1)) > 0.08
        for: 5m
        labels:
          severity: critical
          project_name: KaiOps
          application: KaiOps
        annotations:
          summary: "High application error rate"
          description: "Gateway non-ok status ratio is above threshold for the last 5 minutes."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(kaiops_request_latency_seconds_bucket[5m])) by (le, service, operation)) > 1.5
        for: 10m
        labels:
          severity: warning
          project_name: KaiOps
          application: KaiOps
        annotations:
          summary: "High request latency"
          description: "P95 latency is above 500ms for {{ $labels.service }} {{ $labels.operation }}."

      - alert: LowRequestThroughput
        expr: sum(rate(kaiops_gateway_requests_total[5m])) < 0.2
        for: 15m
        labels:
          severity: warning
          project_name: KaiOps
          application: KaiOps
        annotations:
          summary: "Low request throughput"
          description: "Request throughput dropped below expected baseline."

      - alert: NodeNotReady
        expr: (kube_node_status_condition{condition="Ready", status="true"} == 0) and on() (count(up{job="kube-state-metrics"}) > 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node not ready"
          description: "Kubernetes node {{ $labels.node }} is not Ready."

      - alert: ContainerOOMKilled
        expr: (increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[5m]) > 0) and on() (count(up{job="kube-state-metrics"}) > 0)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container OOMKilled"
          description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled."

      - alert: HighNetworkLatency
        expr: probe_duration_seconds{job="blackbox"} > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High network latency"
          description: "HTTP probe duration is above 200ms for target {{ $labels.instance }}."

      - alert: HighNetworkPacketLoss
        expr: avg_over_time(probe_success{job="blackbox"}[5m]) < 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High network packet loss"
          description: "HTTP probe success ratio dropped below 95% for target {{ $labels.instance }}."

      - alert: RabbitMQQueueBacklog
        # Sized for a 10k-alerts/day workload (~7/min average, bursts of a
        # few hundred/hour during an incident storm), not a much larger
        # deployment: 500 ready messages held for 10m is already well beyond
        # a burst working itself through the pipeline and indicates a
        # stalled consumer, not just momentary queueing.
        expr: sum(rabbitmq_queue_messages_ready) > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue backlog high"
          description: "More than 500 messages are waiting across KaiOps RabbitMQ queues."

      - alert: RabbitMQBrokerDown
        expr: up{job="kaiops-rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ broker down"
          description: "The KaiOps RabbitMQ broker is not responding."

      - alert: DatabaseConnectionFailure
        expr: (rate(mysql_global_status_aborted_connects[5m]) > 0.1) or ((mysql_global_status_threads_connected / clamp_min(mysql_global_variables_max_connections, 1)) > 0.98)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Database connection failure risk"
          description: "MySQL connection failures are detected or connection usage is above 95%."

      - alert: DatabaseSlowQueries
        expr: rate(mysql_global_status_slow_queries[5m]) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Database slow queries"
          description: "Slow query rate is above baseline."

      - alert: SSLCertificateExpiry
        expr: (probe_ssl_earliest_cert_expiry - time()) < 2592000
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiry approaching"
          description: "SSL certificate for {{ $labels.instance }} expires in less than 30 days."

      - alert: KubernetesDeploymentReplicasMismatch
        expr: (kube_deployment_status_replicas_available < kube_deployment_spec_replicas) and on() (count(up{job="kube-state-metrics"}) > 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Deployment replicas mismatch"
          description: "Available replicas are lower than desired for deployment {{ $labels.namespace }}/{{ $labels.deployment }}."

      - alert: LLMAPIFailure
        expr: increase(kaiops_agent_executions_total{agent="resolution-agent",status!="succeeded"}[10m]) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "LLM API failures"
          description: "Resolution agent recorded non-succeeded executions in the last 10 minutes."

      - alert: RAGRetrievalFailure
        expr: increase(kaiops_agent_executions_total{agent="context-agent",status!="succeeded"}[10m]) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "RAG retrieval failure"
          description: "Context agent recorded non-succeeded executions in the last 10 minutes."

      - alert: VectorDBHighLatency
        expr: histogram_quantile(0.95, sum(rate(kaiops_agent_stage_latency_seconds_bucket{agent="context-agent",stage="execute"}[5m])) by (le)) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Vector DB high latency"
          description: "Context agent execute-stage P95 latency is above 3 seconds."

      - alert: RabbitMQUnackedBacklog
        # Sized for 10k-alerts/day: consumer prefetch counts are small
        # (RABBITMQ_CONSUMER_PREFETCH_COUNT default 2), so unacked should
        # stay in the tens even under burst. 2,000 held for 10m indicates
        # consumers are stuck processing (or crash-looping before ack), not
        # normal in-flight work.
        expr: sum(rabbitmq_queue_messages_unacked) > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ unacknowledged backlog high"
          description: "RabbitMQ unacknowledged messages exceeded the operational threshold."

      - alert: AgentProcessingTimeout
        expr: histogram_quantile(0.95, sum(rate(kaiops_agent_stage_latency_seconds_bucket[5m])) by (le, agent)) > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Agent processing timeout"
          description: "Agent {{ $labels.agent }} processing exceeded 60 seconds at P95."

      - alert: WorkflowExecutionFailure
        expr: increase(kaiops_events_processed_total{status!="ok"}[10m]) > 2
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Workflow execution failure"
          description: "One or more pipeline services reported non-ok event processing results."

      - alert: PolicyEngineUnavailable
        expr: absent(kaiops_events_processed_total{service="orchestrator"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Policy engine unavailable"
          description: "No orchestrator event-processing metric is present."

      - alert: AutomationExecutionFailure
        expr: increase(kaiops_events_processed_total{service="remediation-engine",status!="ok"}[10m]) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Automation execution failure"
          description: "Remediation engine reported non-ok event processing results."

      - alert: HumanApprovalTimeout
        expr: sum(rate(kaiops_events_processed_total{service="approval-service",status="ok"}[20m])) == 0 and sum(rate(kaiops_events_processed_total{service="resolution-agent",status="ok"}[20m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Human approval timeout"
          description: "No approval processing detected while resolution events are being produced."

      - alert: IncidentProcessingQueueHigh
        expr: sum(rate(kaiops_events_processed_total{topic=~"raw-alerts.*",status="ok"}[10m])) > 1 and sum(rate(kaiops_events_processed_total{topic=~"closure-events.*",status="ok"}[10m])) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Incident processing queue high"
          description: "Raw alerts are being processed but no closure events are observed."

  - name: robot-shop
    rules:
      - alert: RobotShopServiceDown
        expr: up{job=~"robot-shop-.*"} == 0
        for: 20s
        labels:
          severity: critical
          source: robot-shop
        annotations:
          summary: "Robot Shop dependency {{ $labels.job }} is unreachable"
          description: "Prometheus cannot scrape {{ $labels.job }} for more than 20s."

      - alert: RobotShopMySQLTooManyConnections
        expr: mysql_global_status_threads_connected > 50
        for: 30s
        labels:
          severity: warning
          source: robot-shop
        annotations:
          summary: "Robot Shop MySQL connections high"
          description: "mysql_global_status_threads_connected is {{ $value }}."

      - alert: RobotShopRabbitMQQueueBacklog
        expr: sum(rabbitmq_queue_messages_ready) > 100
        for: 30s
        labels:
          severity: warning
          source: robot-shop
        annotations:
          summary: "Robot Shop RabbitMQ queue backlog"
          description: "{{ $value }} messages ready and unconsumed across queues."

      - alert: RobotShopRedisDown
        expr: redis_up == 0
        for: 20s
        labels:
          severity: critical
          source: robot-shop
        annotations:
          summary: "Robot Shop Redis is unreachable"
          description: "redis_exporter cannot reach the Redis instance."

      - alert: RobotShopMongoDown
        expr: mongodb_up == 0
        for: 20s
        labels:
          severity: critical
          source: robot-shop
        annotations:
          summary: "Robot Shop MongoDB is unreachable"
          description: "mongodb_exporter cannot reach the MongoDB instance."

  - name: online-boutique
    rules:
      # Online Boutique has no app-level metrics anywhere (verified against
      # source), so its only real signal today is this HTTP health probe.
      # NOTE: a per-container cAdvisor CPU/restart rule was deliberately
      # NOT added here — verified live that this cAdvisor version doesn't
      # expose a "name" label matching container names, so a label-matched
      # rule would silently never fire. Not fixed here; flagged as a known
      # gap.
      - alert: OnlineBoutiqueFrontendDown
        expr: probe_success{job="blackbox", instance="http://ob-frontend:8080/_healthz"} == 0
        for: 15s
        labels:
          severity: critical
          source: online-boutique
        annotations:
          summary: "Online Boutique frontend is not responding"
          description: "blackbox probe against ob-frontend /_healthz has been failing for 15s."

      - alert: OnlineBoutiqueFrontendSlow
        expr: probe_duration_seconds{job="blackbox", instance="http://ob-frontend:8080/_healthz"} > 1
        for: 30s
        labels:
          severity: warning
          source: online-boutique
        annotations:
          summary: "Online Boutique frontend responding slowly"
          description: "Health-check probe duration is {{ $value }}s."

  - name: kaiops-context-knowledge-telemetry
    rules:
      - record: kaiops:context_cache_hit_ratio:5m
        expr: sum(rate(kaiops_context_strategy_requests_total{strategy="continuous",outcome="cache_hit"}[5m])) / clamp_min(sum(rate(kaiops_context_strategy_requests_total{strategy="continuous",outcome=~"cache_hit|cache_miss"}[5m])), 0.000001)

      - record: kaiops:context_reused_latency_p95_seconds:5m
        expr: histogram_quantile(0.95, sum(rate(kaiops_context_strategy_duration_seconds_bucket{strategy="continuous",path="reused"}[5m])) by (le))

      - record: kaiops:context_fresh_latency_p95_seconds:5m
        expr: histogram_quantile(0.95, sum(rate(kaiops_context_strategy_duration_seconds_bucket{path="fresh_discovery"}[5m])) by (le, strategy))

      - alert: KaiOpsContextDiscoveryFailures
        expr: sum(increase(kaiops_context_strategy_requests_total{outcome="discovery_error"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          component: context-knowledge
        annotations:
          summary: "Context discovery is failing"
          description: "{{ $value }} context discovery failures occurred in the last five minutes."

      - alert: KaiOpsContextKnowledgeRepositoryErrors
        expr: sum(increase(kaiops_context_knowledge_operations_total{result=~"error|invalid"}[10m])) > 0
        for: 2m
        labels:
          severity: warning
          component: context-knowledge
        annotations:
          summary: "Context knowledge repository operations are failing"
          description: "Lookup, persistence, validation, or RCA attachment errors were observed in the last ten minutes. Fresh discovery remains the fallback path."

      - alert: KaiOpsContextCacheHitRatioLow
        expr: kaiops:context_cache_hit_ratio:5m < 0.20 and sum(increase(kaiops_context_strategy_requests_total{strategy="continuous",outcome=~"cache_hit|cache_miss"}[15m])) >= 20
        for: 15m
        labels:
          severity: warning
          component: context-knowledge
        annotations:
          summary: "Continuous context cache hit ratio is low"
          description: "Cache hit ratio has remained below 20% with sufficient traffic. Check alert signatures, TTL, and knowledge persistence."

      - alert: KaiOpsReusedContextLatencyHigh
        expr: kaiops:context_reused_latency_p95_seconds:5m > 2
        for: 10m
        labels:
          severity: warning
          component: context-knowledge
        annotations:
          summary: "Reused context retrieval is slow"
          description: "p95 reused-context latency is {{ $value }} seconds, above the 2 second objective."

      - alert: KaiOpsFreshContextLatencyHigh
        expr: kaiops:context_fresh_latency_p95_seconds:5m > 60
        for: 10m
        labels:
          severity: warning
          component: context-discovery
        annotations:
          summary: "Fresh context discovery is slow"
          description: "p95 fresh-discovery latency is {{ $value }} seconds, above the 60 second objective."

      - alert: KaiOpsResolutionKnowledgeNotFound
        expr: sum(increase(kaiops_context_knowledge_operations_total{operation="attach_resolution",result="not_found"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
          component: context-knowledge
        annotations:
          summary: "RCA could not be attached to context knowledge"
          description: "Resolution completed but its context knowledge record was not found."

  - name: kaiops-production-telemetry
    rules:
      - alert: KaiOpsSSEDisconnected
        expr: sum(kaiops_sse_connections) == 0
        for: 15m
        labels: {severity: warning, component: sse}
        annotations:
          summary: "No KaiOps live-update clients are connected"
          description: "No authenticated SSE connection has been observed for 15 minutes; clients may be using polling fallback."

      - alert: KaiOpsDeadLettersIncreasing
        expr: sum(increase(kaiops_dead_letter_events_total[10m])) > 0
        for: 2m
        labels: {severity: critical, component: message-bus}
        annotations:
          summary: "KaiOps events are entering dead-letter queues"
          description: "{{ $value }} events entered a dead-letter path in the last ten minutes."

      - alert: KaiOpsWorkflowFailures
        expr: sum(increase(kaiops_workflow_failures_total[10m])) > 0
        for: 2m
        labels: {severity: critical, component: workflow}
        annotations:
          summary: "KaiOps durable workflow activity failures detected"
          description: "{{ $value }} workflow activity failures occurred in the last ten minutes."

      - alert: KaiOpsMySQLP95LatencyHigh
        expr: histogram_quantile(0.95, sum(rate(kaiops_mysql_query_latency_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels: {severity: warning, component: mysql}
        annotations:
          summary: "KaiOps MySQL p95 query latency is high"
          description: "MySQL p95 query latency has exceeded one second for ten minutes."

      - alert: KaiOpsModelFallbackRateHigh
        expr: sum(rate(kaiops_llm_fallback_total[10m])) > 0.1
        for: 10m
        labels: {severity: warning, component: model-router}
        annotations:
          summary: "KaiOps model fallback rate is elevated"
          description: "Model fallbacks exceed 0.1 per second; inspect provider health and quota."
