global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml
  - /etc/prometheus/generated-rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: kaiops-api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: kaiops-monitoring-adapter
    metrics_path: /metrics
    static_configs:
      - targets: ["monitoring-adapter:8000"]

  - job_name: kaiops-alert-intelligence
    metrics_path: /metrics
    static_configs:
      - targets: ["alert-intelligence:8000"]

  - job_name: kaiops-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:8000"]

  - job_name: kaiops-context-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["context-agent:8000"]

  - job_name: kaiops-model-router
    metrics_path: /metrics
    static_configs:
      - targets: ["model-router:8000"]

  - job_name: kaiops-resolution-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["resolution-agent:8000"]

  - job_name: kaiops-approval-service
    metrics_path: /metrics
    static_configs:
      - targets: ["approval-service:8000"]

  - job_name: kaiops-remediation-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["remediation-engine:8000"]

  - job_name: kaiops-closure-service
    metrics_path: /metrics
    static_configs:
      - targets: ["closure-service:8000"]

  - job_name: mysql-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["mysql-exporter:9104"]

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]

  # - job_name: kube-state-metrics
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["kube-state-metrics:8080"]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api-gateway:8000/healthz
          - http://monitoring-adapter:8000/healthz
          - http://orchestrator:8000/healthz
          - http://resolution-agent:8000/healthz
          # Online Boutique has no app-level /metrics anywhere (verified
          # against source — initStats() is an unimplemented TODO in every
          # service), so its uptime/latency signal comes from this same
          # blackbox-exporter probing its real health endpoint.
          - http://ob-frontend:8080/_healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Real per-container CPU/memory/restart signals for Online Boutique,
  # since it has no app-level metrics.
  - job_name: online-boutique-cadvisor
    static_configs:
      - targets: ["ob-cadvisor:8080"]

  # rs-cart and rs-payment expose real Prometheus /metrics natively.
  - job_name: robot-shop-cart
    metrics_path: /metrics
    static_configs:
      - targets: ["rs-cart:8080"]

  - job_name: robot-shop-payment
    metrics_path: /metrics
    static_configs:
      - targets: ["rs-payment:8080"]

  # mongodb/redis/rabbitmq/mysql don't expose /metrics natively — standard
  # community exporters provide real infrastructure metrics instead.
  - job_name: robot-shop-mysql
    static_configs:
      - targets: ["rs-mysqld-exporter:9104"]

  - job_name: robot-shop-redis
    static_configs:
      - targets: ["rs-redis-exporter:9121"]

  - job_name: robot-shop-rabbitmq
    static_configs:
      - targets: ["rs-rabbitmq-exporter:9419"]

  - job_name: robot-shop-mongodb
    static_configs:
      - targets: ["rs-mongodb-exporter:9216"]

  - job_name: kaiops-rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: kaiops-dynamic-applications
    honor_labels: true
    file_sd_configs:
      - files:
          - /etc/prometheus/generated-targets/*.json
    relabel_configs:
      - source_labels: [__meta_filepath]
        target_label: kaiops_generated_target
