name: ci

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      total_alerts:
        description: "Number of alerts to send"
        default: "2000"
      concurrency:
        description: "Concurrent in-flight requests"
        default: "50"
      p95_threshold_ms:
        description: "Fail the job if p95 latency exceeds this (milliseconds)"
        default: "2000"
      p99_threshold_ms:
        description: "Fail the job if p99 latency exceeds this (milliseconds)"
        default: "5000"
      min_acceptance_pct:
        description: "Fail the job if acceptance percentage falls below this"
        default: "99"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
      - name: Install frozen backend dependencies
        run: uv sync --frozen --extra dev
      - name: Verify Docker requirements projection
        run: uv run python scripts/sync_locked_requirements.py
      - name: Lint
        run: uv run python scripts/check_ruff_regression.py --baseline 6e524173ad0c752272b6c53518e0cc8108bf820d
      - name: Validate strict RAG governance
        run: uv run python scripts/validate-rag-metadata.py --rag-root backend/rag --strict
      - name: Validate non-empty production RAG readiness
        run: uv run python scripts/validate-rag-metadata.py --rag-root backend/rag --require-production-ready
      - name: Validate governed execution catalogs and checksums
        run: |
          uv run python scripts/validate_execution_catalog.py
          uv run python scripts/update_execution_catalog_checksums.py --check
      - name: Validate Phase 9 production-readiness artifacts
        run: uv run python scripts/validate_phase9_readiness.py
      - name: Reject mixed source and deployment baselines
        run: |
          uv run python scripts/validate_recovery_topology.py
          uv run pytest scripts/tests/test_recovery_topology.py
      - name: Test correlation backfill and ingestion concurrency
        run: uv run pytest backend/tests/test_incident_correlation_backfill.py backend/tests/test_landing_pad_ingest_concurrency.py
      - name: Test
        run: uv run pytest

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/react/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Static analysis, architecture budgets, and unit tests
        run: npm run quality
      - name: Production build and bundle budget
        run: npm run build:budget

  frontend-critical-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/react/package-lock.json
      - name: Install locked frontend and browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test critical authenticated incident journeys
        run: >-
          npx playwright test
          tests/e2e/navigation-routing.spec.js
          tests/e2e/incident-detail-handoff.spec.js
          tests/e2e/resolution-approval-fallback.spec.js
          tests/e2e/next-gen-experience.spec.js
          tests/e2e/cloud-resource-explorer.spec.js

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/react/package-lock.json
      - name: Audit Python dependencies
        run: |
          uv sync --frozen --extra dev
          uv run pip-audit --local --skip-editable
      - name: Audit frontend dependencies
        working-directory: frontend/react
        run: npm audit --audit-level=high

  docker-build:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [test, frontend-quality, frontend-critical-e2e, dependency-security, deployment-contracts, migration-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build shared backend service image once
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.service
          push: false
          tags: kaiops/service:${{ github.sha }}
          cache-from: type=gha,scope=kaiops-service
          cache-to: type=gha,mode=max,scope=kaiops-service
      - name: Build production UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.ui
          push: false
          tags: kaiops/ui:${{ github.sha }}
          cache-from: type=gha,scope=kaiops-ui
          cache-to: type=gha,mode=max,scope=kaiops-ui

  kube-validate:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests with strict client-side schemas
        run: >-
          docker run --rm
          -v "${PWD}/k8s:/work/k8s:ro"
          ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary /work/k8s

  deployment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject mixed baselines and embedded manifest credentials
        run: python scripts/validate_recovery_topology.py
      - name: Resolve the complete Compose model
        run: docker compose config --quiet
      - name: Verify canonical Docker build inputs
        run: |
          test -f deploy/docker/Dockerfile.service
          test -f deploy/docker/Dockerfile.ui
          test -f frontend/react/package-lock.json

  # Manual only (workflow_dispatch) — brings up the real ingestion path
  # against Docker Compose and gates on measured latency, not just
  # acceptance count. Acceptance-count-only stress runs can't prove an SLO;
  # this produces the p95/p99 evidence the release-readiness doc calls for.
  migration-validation:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kaiops
          MYSQL_USER: kaiops
          MYSQL_PASSWORD: kaiops
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
      - name: Install frozen backend dependencies
        run: uv sync --frozen --extra dev
      - name: Validate migration runner and correlation backfill
        run: uv run pytest backend/tests/test_apply_migrations.py backend/tests/test_incident_correlation_backfill.py
      - name: Bootstrap canonical database schema
        run: >-
          docker run --rm --network host
          -e MYSQL_PWD=kaiops
          -v "${PWD}:/work:ro"
          mysql:8.4
          sh -lc 'mysql -h127.0.0.1 -ukaiops kaiops < /work/backend/database/schema.sql'
      - name: Dry-run, upgrade, and idempotency validation
        env:
          DATABASE_URL: mysql+pymysql://kaiops:kaiops@127.0.0.1:3306/kaiops
        run: |
          uv run python scripts/apply-migrations.py --dry-run
          uv run python scripts/apply-migrations.py
          uv run python scripts/apply-migrations.py

  # Manual load evidence; this is intentionally dispatch-only.
  load-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stress harness dependency
        run: pip install httpx
      - name: Start ingestion path
        run: docker compose up -d --build mysql rabbitmq redis monitoring-adapter alert-intelligence api-gateway
      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8010/healthz >/dev/null 2>&1; then
              echo "gateway healthy"
              exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy in time" >&2
          docker compose logs --tail 100
          exit 1
      - name: Run stress load with latency gate
        run: |
          python scripts/stress_ingest_gateway_alerts.py \
            --base-url http://localhost:8010 \
            --total "${{ github.event.inputs.total_alerts }}" \
            --concurrency "${{ github.event.inputs.concurrency }}" \
            --p95-threshold-ms "${{ github.event.inputs.p95_threshold_ms }}" \
            --p99-threshold-ms "${{ github.event.inputs.p99_threshold_ms }}" \
            --min-acceptance-pct "${{ github.event.inputs.min_acceptance_pct }}"
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
